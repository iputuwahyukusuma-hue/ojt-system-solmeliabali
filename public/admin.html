<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Rekap OJT - Sol by Meliá</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
  <div class="container bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3>Rekapitulasi Laporan OJT Trainee</h3>
      <button onclick="muatDataLaporan()" class="btn btn-sm btn-outline-secondary">Refresh Data</button>
    </div>
    
    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark text-center">
          <tr>
            <th>No</th>
            <th>Tanggal</th>
            <th>Nama Mahasiswa</th>
            <th>NIM</th>
            <th>Departemen</th>
            <th>Aktivitas</th>
            <th>Dokumentasi</th>
          </tr>
        </thead>
        <tbody id="tabelLaporan">
          <!-- Data otomatis masuk ke sini -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function muatDataLaporan() {
      try {
        const response = await fetch('/api/laporan');
        const data = await response.json();
        const tabel = document.getElementById('tabelLaporan');
        
        tabel.innerHTML = '';

        if (data.length === 0) {
          tabel.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Belum ada data laporan yang masuk.</td></tr>';
          return;
        }

        data.forEach((item, index) => {
          const row = `
            <tr>
              <td class="text-center">${index + 1}</td>
              <td>${item.tanggal}</td>
              <td><strong>${item.nama}</strong></td>
              <td>${item.nim}</td>
              <td><span class="badge bg-primary">${item.departemen}</span></td>
              <td>${item.aktivitas}</td>
              <td class="text-center">
                ${item.foto ? `<a href="${item.foto}" target="_blank" class="btn btn-sm btn-success">Lihat Foto</a>` : '<span class="text-muted">Tidak Ada</span>'}
              </td>
            </tr>
          `;
          tabel.innerHTML += row;
        });
      } catch (error) {
        console.error('Gagal memuat data:', error);
      }
    }

    muatDataLaporan();
  </script>
</body>
</html>
